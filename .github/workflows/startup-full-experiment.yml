name: Full startup measurement
on:
  push:
    branches: ["ci/startup-full-20261102t152005z-956594"]
permissions:
  contents: read
env:
  SHARD_TOTAL: 5
jobs:
  measure:
    name: Startup ${{ matrix.mode }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        mode: [plain, recorded]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          # no `cache: maven` - broken in this release line (restore misses, save
          # fails with Path Validation Error); explicit cache steps below.

      # Restore on every shard; save from shard 1 only. With a combined cache step
      # every shard would race the same save key: one wins, the rest spend
      # post-job time reserving-then-failing plus redundant multi-hundred-MB uploads.
      - id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Derived from test sources, not target/test-classes, so shard.txt exists
      # before Compile and the image prefetch below overlaps the compile instead
      # of starting moments before the tests that need the images. Every test is
      # a top-level class in src/test/java, so the file name is the class name;
      # the step after Compile fails the shard if that ever stops being true.
      - name: Compute shard include list
        run: python3 tools/startup-full/run.py phase selection bash tools/startup-full/select.sh "${{ matrix.shard }}"

      - name: Prefetch this shard's Docker images (background)
        run: .github/ci/prefetch-images.sh shard.txt || true

      - name: Record original inputs
        env:
          STARTUP_CACHE_MATCHED_KEY: ${{ steps.maven-cache.outputs.cache-matched-key }}
          STARTUP_CACHE_HIT: ${{ steps.maven-cache.outputs.cache-hit }}
        run: python3 tools/startup-full/run.py inputs

      - name: Configure fixed fork arguments before compilation
        run: python3 tools/startup-full/run.py configure "${{ matrix.mode }}"

      - name: Compile
        run: python3 tools/startup-full/run.py phase compile ./mvnw test-compile -B

      # all-classes.txt is derived from file names, so a test class whose name
      # differs from its file would drop out of both it and the shard union
      # without the completeness check noticing. The compiled classes are the
      # ground truth; fail here if the two lists ever disagree.
      - name: Verify shard list matches compiled test classes
        run: |
          cd target/test-classes
          find . \( -name '*Test.class' -o -name 'Test*.class' \
                    -o -name '*Tests.class' -o -name '*TestCase.class' \) \
                  ! -name '*$*' \
            | sed 's|^\./||; s|\.class$||' | LC_ALL=C sort \
            > "$RUNNER_TEMP/compiled-classes.txt"
          cd "$GITHUB_WORKSPACE"
          cmp -s all-classes.txt "$RUNNER_TEMP/compiled-classes.txt" \
            || { echo "::error::test class list from src/test/java differs from target/test-classes:"; diff all-classes.txt "$RUNNER_TEMP/compiled-classes.txt" | head -50; exit 1; }

      - name: Retain source-to-compiled inventory receipt
        run: python3 tools/startup-full/run.py inventory

      - name: Prepare passive recording and capture class identities
        run: python3 tools/startup-full/run.py prepare "${{ matrix.mode }}"

      # surefire.timeout kills a fork whose test ignores JUnit's interrupt (deadlock, blocking
      # I/O). It caps the whole shard (one fork runs all its tests), so 20 min leaves room above
      # the slowest shard, about 12.5 min of tests across five, and still lets surefire report
      # before the 25-minute job limit.
      - name: Run tests
        run: >
          python3 tools/startup-full/run.py phase tests ./mvnw surefire:test -B
          -Dsurefire.includesFile="$GITHUB_WORKSPACE/shard.txt"
          -Dsurefire.failIfNoTests=true
          -Dsurefire.timeout=1200

      - name: Verify recording, unchanged classes and test coverage
        if: always()
        run: python3 tools/startup-full/run.py verify "${{ matrix.mode }}"

      # The prefetch runs in the background past its own step, so its per-image
      # results are only complete once the tests are done. A pull still running
      # here (after an early exit) has no result line yet, so list it. The
      # prefetch is best-effort by design, so a key that no longer matches a
      # class, a pin the script could not read, or an image back on ECR Public
      # that Docker Hub also carries (only the Lambda runtimes belong there) is
      # an annotation, not a failure.
      - name: Image prefetch results
        if: always()
        run: |
          cat prefetch-images.log 2>/dev/null || echo "no prefetch log"
          pgrep -af 'docker pull' | sed 's/^/still running: /' || true
          grep -E 'stale prefetch key|prefetch skipped' prefetch-images.log 2>/dev/null \
            | sed 's/^/::warning title=prefetch-images.sh::/' || true
          grep -E '(prefetched|prefetch failed) public\.ecr\.aws/' prefetch-images.log 2>/dev/null \
            | grep -vE 'public\.ecr\.aws/lambda/' \
            | sed 's/^/::warning title=prefetch-images.sh::not a Lambda runtime, pull it from Docker Hub: /' || true


      - name: Retain measurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startup-${{ matrix.mode }}-${{ matrix.shard }}
          path: |
            startup-evidence/
            shard.txt
            all-classes.txt
            prefetch-images.log
            target/surefire-reports/
          if-no-files-found: error

  coverage:
    name: Verify complete five-shard measurement
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: startup-*
          path: measurements
      - name: Verify disjoint complete selections and identical cases
        run: python3 tools/startup-full/run.py aggregate measurements
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: startup-aggregate
          path: startup-evidence/aggregate.json
          if-no-files-found: error
