name: Fixture health timing pair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            source: 5058ccc511cca8dd9ee8adffb3a521ff0d97f827
          - mode: candidate
            source: 4c7842ac1c1d00c44b3871d54d95e22c4eac245a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Measure compilation and the same two test classes
        env:
          PAIR_MODE: ${{ matrix.mode }}
          PAIR_SOURCE: ${{ matrix.source }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import xml.etree.ElementTree as ET

          result = Path("fixture-pair")
          result.mkdir()
          mode = os.environ["PAIR_MODE"]
          runtime = Path(os.environ["RUNNER_TEMP"]) / ("fixture-pair-" + mode)
          runtime.mkdir()
          production = hashlib.sha256()
          for path in sorted(Path("src/main").rglob("*")):
              if path.is_file():
                  production.update(str(path).encode() + b"\0" + path.read_bytes())
          inventory = sorted(str(path) for path in Path("src/test/java").rglob("*.java"))
          metrics = {
              "mode": mode,
              "source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "pomSha256": hashlib.sha256(Path("pom.xml").read_bytes()).hexdigest(),
              "productionSha256": production.hexdigest(),
              "testInventorySha256": hashlib.sha256("\n".join(inventory).encode()).hexdigest(),
              "runnerImage": os.environ.get("ImageVersion"),
              "runnerOS": os.environ.get("ImageOS"),
              "classes": ["ElbV2BackendTlsIntegrationTest", "ElbV2HealthCheckerTest"],
              "java": subprocess.run(["java", "-version"], capture_output=True, text=True).stderr,
          }
          assert metrics["source"] == os.environ["PAIR_SOURCE"]
          properties = [
              "-Dquarkus.http.test-port=0",
              "-Dquarkus.http.test-ssl-port=0",
              "-Dfloci.docker.resource-namespace=fixture-pair-" + os.environ["GITHUB_RUN_ID"] + "-" + mode,
              "-Djava.io.tmpdir=" + str(runtime),
              "-Dvertx.cacheDirBase=" + str(runtime / "vertx-cache"),
          ]
          for phase, arguments in (
              ("compile", ["test-compile", "-DskipTests"]),
              ("tests", ["surefire:test", "-Dtest=" + ",".join(metrics["classes"])]),
          ):
              started = time.monotonic()
              with (result / (phase + ".log")).open("w") as output:
                  code = subprocess.run(["./mvnw", "-B"] + arguments + properties,
                                        stdout=output, stderr=subprocess.STDOUT).returncode
              metrics[phase] = {"seconds": time.monotonic() - started, "exitCode": code}
              (result / "metrics.json").write_text(json.dumps(metrics, indent=2) + "\n")
              if code:
                  raise SystemExit(code)
          cases = []
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          assert len(reports) == 2
          for path in reports:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, "0"))
              for case in suite.findall("testcase"):
                  outcome = next((kind for kind in ("failure", "error", "skipped")
                                  if case.find(kind) is not None), "passed")
                  cases.append({"class": case.get("classname"), "name": case.get("name"),
                                "outcome": outcome, "seconds": float(case.get("time", "0"))})
          metrics["counts"] = totals
          metrics["cases"] = cases
          (result / "metrics.json").write_text(json.dumps(metrics, indent=2) + "\n")
          assert totals == {"tests": 38, "failures": 0, "errors": 0, "skipped": 0}
          PY
      - name: Retain timing and raw reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixture-health-${{ matrix.mode }}
          path: |
            fixture-pair/
            target/surefire-reports/
          if-no-files-found: error
          retention-days: 7
