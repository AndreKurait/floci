name: Nightly checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pig-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Prefetch Pig runtime images
        run: |
          echo io/floci/aws/services/emr/EmrPigStepsNightlyIntegrationTest > nightly.txt
          .github/ci/prefetch-images.sh nightly.txt
      - name: Run the unchanged Pig test with phase diagnostics
        run: python3 .github/ci/pig-diagnostic.py
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pig-preparation-diagnostic
          path: |
            diagnostics/
            target/surefire-reports/
            prefetch-images.log
          if-no-files-found: error
