name: EMR tiny word-count qualification

on:
  push:
    branches: [validate/emr-wordcount-size-20261115]

permissions:
  contents: read

concurrency:
  group: emr-wordcount-size-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'AndreKurait/floci'
    name: Word-count Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            source: f3a0595f502b6fa6947ce48a964753b4aaadf54e
          - variant: candidate
            source: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Record source, runner and Docker availability
        run: |
          git rev-parse HEAD > qualification-source.txt
          lscpu > qualification-runner.txt
          free -b >> qualification-runner.txt
          docker info > qualification-docker.txt
          printf '%s\n' 'io/floci/aws/services/emr/EmrDockerRunnerDockerIntegrationTest' > wordcount-includes.txt
      - name: Prefetch EMR test images
        run: .github/ci/prefetch-images.sh wordcount-includes.txt || true
      - name: Compile unchanged repository sources and tests
        run: ./mvnw -B -ntp test-compile
      - name: Run both original word-count Docker scenarios
        run: >
          ./mvnw -B -ntp surefire:test
          -Dtest=EmrDockerRunnerDockerIntegrationTest#aStreamingWordCountStepReadsItsInputAndWritesItsCountsInFlocisS3+aCustomJarAtEmrsStreamingJarPathRunsItsWordCountInTheDriver
          -Dsurefire.failIfNoTests=true
          -Dsurefire.timeout=1500
          -Dquarkus.http.test-port=0
          -Dquarkus.management.test-port=0
      - name: Require actual execution without skipped cases
        if: always()
        run: |
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('target/surefire-reports/TEST-io.floci.aws.services.emr.EmrDockerRunnerDockerIntegrationTest.xml')
          root = ET.parse(report).getroot()
          result = {key: int(root.attrib[key]) for key in ('tests', 'failures', 'errors', 'skipped')}
          result['classSeconds'] = float(root.attrib['time'])
          result['cases'] = [{'name': case.attrib['name'], 'seconds': float(case.attrib['time'])}
                             for case in root.findall('testcase')]
          result['source'] = Path('qualification-source.txt').read_text().strip()
          Path('qualification-result.json').write_text(json.dumps(result, indent=2))
          if result['tests'] != 2 or any(result[key] for key in ('failures', 'errors', 'skipped')):
              raise SystemExit('Both real word-count cases must pass without skips')
          PYTEST
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcount-${{ matrix.variant }}
          path: |
            qualification-*.txt
            qualification-result.json
            prefetch-images.log
            target/surefire-reports/
          if-no-files-found: error
