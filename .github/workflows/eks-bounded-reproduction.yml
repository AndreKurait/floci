name: EKS bounded failure reproduction
on:
  push:
    branches: ["ci/eks-diagnostics-20261102t193850z-1554239"]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOCI_DOCKER_RESOURCE_NAMESPACE: eks-diag-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Record source and ownership before allocation
        run: |
          mkdir -p eks-evidence
          git rev-parse HEAD HEAD^{tree} > eks-evidence/source.txt
          sha256sum src/test/java/io/github/hectorvent/floci/services/eks/EksRegistryHostsDockerIntegrationTest.java > eks-evidence/source.sha256
          printf '%s\n' "$FLOCI_DOCKER_RESOURCE_NAMESPACE" > eks-evidence/owned-namespace.txt
          docker ps -aq --no-trunc | sort > eks-evidence/containers-before.txt
          docker volume ls -q | sort > eks-evidence/volumes-before.txt
          date -u +%s > eks-evidence/start-epoch.txt
      - name: Run one focused original workload with failure diagnostics
        run: >-
          ./mvnw -B test
          -Dtest=EksRegistryHostsDockerIntegrationTest
          -Dsurefire.failIfNoTests=true
          -Dsurefire.timeout=600
      - name: Record and clean only owned Docker resources
        if: always()
        run: |
          docker events --since "$(cat eks-evidence/start-epoch.txt)" --until "$(date -u +%s)" --filter "label=floci_namespace=$FLOCI_DOCKER_RESOURCE_NAMESPACE" --format '{{json .}}' > eks-evidence/docker-events.jsonl
          docker ps -aq --no-trunc --filter "label=floci_namespace=$FLOCI_DOCKER_RESOURCE_NAMESPACE" > eks-evidence/owned-containers-before-cleanup.txt
          while IFS= read -r container; do
            test -n "$container" || continue
            docker inspect --format '{{.Id}} {{.Name}} {{.State.Status}}' "$container" >> eks-evidence/owned-container-states.txt
            docker rm -fv "$container"
          done < eks-evidence/owned-containers-before-cleanup.txt
          docker volume ls -q --filter "label=floci_namespace=$FLOCI_DOCKER_RESOURCE_NAMESPACE" > eks-evidence/owned-volumes-before-cleanup.txt
          while IFS= read -r volume; do
            test -n "$volume" || continue
            docker volume rm "$volume"
          done < eks-evidence/owned-volumes-before-cleanup.txt
          docker ps -aq --no-trunc --filter "label=floci_namespace=$FLOCI_DOCKER_RESOURCE_NAMESPACE" > eks-evidence/owned-containers-after.txt
          docker volume ls -q --filter "label=floci_namespace=$FLOCI_DOCKER_RESOURCE_NAMESPACE" > eks-evidence/owned-volumes-after.txt
          test ! -s eks-evidence/owned-containers-after.txt
          test ! -s eks-evidence/owned-volumes-after.txt
          docker ps -aq --no-trunc | sort > eks-evidence/containers-after.txt
          docker volume ls -q | sort > eks-evidence/volumes-after.txt
          diff -u eks-evidence/containers-before.txt eks-evidence/containers-after.txt
          diff -u eks-evidence/volumes-before.txt eks-evidence/volumes-after.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: eks-bounded-reproduction
          path: |
            eks-evidence/
            target/surefire-reports/
          if-no-files-found: error
