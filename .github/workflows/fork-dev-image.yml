name: Fork dev image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-dev-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AndreKurait/floci' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      source-ref: ${{ github.sha }}
      image: ghcr.io/andrekurait/floci

  smoke:
    name: Smoke test (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.source-sha }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,amd64

      - name: Smoke test published image
        env:
          IMAGE: ${{ needs.build.outputs.image-digest-ref }}
          HELPER_IMAGE: ${{ needs.build.outputs.network-helper-digest-ref }}
        run: |
          for architecture in amd64 arm64; do
            bash .github/scripts/smoke-network-helper.sh "$IMAGE" "$HELPER_IMAGE" "$architecture"
          done

  stock-agent:
    name: Stock SSM agent (amd64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.source-sha }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify stock-agent inventory, commands, cancellation and recovery
        env:
          IMAGE: ${{ needs.build.outputs.image-digest-ref }}
          HELPER_IMAGE: ${{ needs.build.outputs.network-helper-digest-ref }}
        run: |
          python3 .github/scripts/smoke-ssm-agent.py "$IMAGE" "$HELPER_IMAGE" \
            --output "$RUNNER_TEMP/stock-agent-smoke"

      - name: Upload agent, runtime and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stock-agent-smoke-amd64
          path: ${{ runner.temp }}/stock-agent-smoke/
          if-no-files-found: error
          retention-days: 14

  promote:
    name: Update dev tag
    needs: [build, smoke, stock-agent]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Point dev at the tested image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.image-digest-ref }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')"
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo "Dev advanced during this build; leaving the moving tag unchanged."
            exit 0
          fi
          docker buildx imagetools create --tag ghcr.io/andrekurait/floci:dev "$IMAGE"
          {
            echo "Pull: \`docker pull ghcr.io/andrekurait/floci:dev\`"
            echo
            echo "Tested immutable image: \`$IMAGE\`"
            echo "Source: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
